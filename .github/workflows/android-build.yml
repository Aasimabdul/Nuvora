name: Nuvora Android Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable debug signing key (optional)
        env:
          NUVORA_DEBUG_KEYSTORE_BASE64: ${{ secrets.NUVORA_DEBUG_KEYSTORE_BASE64 }}
        if: ${{ env.NUVORA_DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$NUVORA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Warn when stable update signing is not configured
        env:
          NUVORA_DEBUG_KEYSTORE_BASE64: ${{ secrets.NUVORA_DEBUG_KEYSTORE_BASE64 }}
        if: ${{ env.NUVORA_DEBUG_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::NUVORA_DEBUG_KEYSTORE_BASE64 is not configured. Debug APK signatures can differ between CI runs, so in-place upgrades are not guaranteed."

      - name: Build Nuvora APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || {
            grep -E '^e: |What went wrong|Execution failed' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nuvora-debug.apk

      - name: Upload Nuvora APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvora-debug-apk
          path: Nuvora-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Nuvora'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          target_commitish: main
          name: Nuvora ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          body: "Nuvora Android debug APK for testing. Provider playback may depend on third-party service availability; validate playback on a real Android device."
          files: Nuvora-debug.apk
          generate_release_notes: true
