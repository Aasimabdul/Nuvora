name: Nuvora Android Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Nuvora APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || {
            grep -E '^e: |What went wrong|Execution failed' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nuvora-debug.apk

      - name: Upload Nuvora APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvora-debug-apk
          path: Nuvora-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Nuvora v0.3.6'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.6
          target_commitish: main
          name: Nuvora v0.3.6
          body: "Nuvora v0.3.6 adds a personalized greeting, mood cards, recently played tracks, horizontal music discovery cards, saved home-section toggles, and the floating minimal player UI. Audius Media3 playback remains supported. YouTube is limited to official embedded video playback. Debug APK for testing."
          files: Nuvora-debug.apk
          generate_release_notes: true
