name: Nuvora Android Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Nuvora APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nuvora-debug.apk

      - name: Upload Nuvora APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvora-debug-apk
          path: Nuvora-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Nuvora v0.5.2'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.5.2' }}
          target_commitish: main
          name: Nuvora ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.5.2' }}
          body: "Nuvora v0.5.2: fixes YouTube Music thumbnail parsing and CDN URL handling. YouTube Music stream resolution remains unofficial and can fail for some tracks. Debug APK for testing; verify playback on a real Android device."
          files: Nuvora-debug.apk
          generate_release_notes: true
