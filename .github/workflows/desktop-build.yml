name: Nuvora Desktop Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach desktop packages to
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build

  linux:
    needs: frontend-check
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: npm install
      - name: Build AppImage and Debian package
        run: npm run tauri -- build --bundles appimage,deb
      - name: Collect Linux packages and checksums
        run: |
          mkdir -p release-files
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-files/ \;
          test -n "$(find release-files -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-files -type f -name '*.deb' -print -quit)"
          cd release-files
          sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nuvora-linux-packages
          path: desktop/release-files/*
          if-no-files-found: error

  windows:
    needs: frontend-check
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Collect installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Copy-Item -Destination release-files
          $installer = Get-ChildItem release-files/*.exe
          if (-not $installer) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii release-files/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nuvora-windows-installer
          path: desktop/release-files/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "nuvora-*", path: release-files, merge-multiple: true }
      - name: Verify release artifacts
        run: |
          find release-files -maxdepth 1 -type f -print
          test -n "$(find release-files -type f -name '*.exe' -print -quit)"
          test -n "$(find release-files -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-files -type f -name '*.deb' -print -quit)"
          cd release-files
          sha256sum -c SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-windows.txt
      - name: Upload desktop packages alongside the Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="${DISPATCH_TAG}"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
