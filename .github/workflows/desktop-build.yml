name: Nuvora Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/nuvora.svg
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nuvora-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential curl file libssl-dev             libayatana-appindicator3-dev librsvg2-dev patchelf             libwebkit2gtk-4.1-dev             libgtk-3-dev
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/nuvora.svg
      - name: Build AppImage and DEB
        run: npm run tauri build -- --bundles appimage,deb
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nuvora-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  publish-desktop-assets:
    name: Attach desktop packages to versioned release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Nuvora'))
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nuvora-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify release files and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
            TAG_NAME="v$VERSION"
          fi
          echo "Publishing desktop assets for $TAG_NAME"
          find release-assets -type f -maxdepth 3 -print
          test "$(find release-assets -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.deb' | wc -l)" -ge 1
          (cd release-assets && sha256sum *.exe *.AppImage *.deb > SHA256SUMS.txt)
          if ! gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$REPOSITORY" --target main \
              --title "Nuvora $TAG_NAME" \
              --notes "Nuvora Android and desktop release. Desktop assets are built on native Windows and Linux runners."
          fi
          gh release upload "$TAG_NAME" release-assets/* --repo "$REPOSITORY" --clobber
          gh release view "$TAG_NAME" --repo "$REPOSITORY"
