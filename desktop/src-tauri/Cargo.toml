[package]
name = "nuvora-desktop"
version = "1.1.0"
description = "Nuvora Desktop music discovery and authorized streaming"
authors = ["Nuvora contributors"]
edition = "2021"

[lib]
name = "nuvora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.5" }
tauri-plugin-opener = "2.5.0"